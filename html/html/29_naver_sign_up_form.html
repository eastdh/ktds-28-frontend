<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Naver Sign Up</title>
    <link
      type="text/css"
      rel="stylesheet"
      href="../css/29_naver_sign_up_form.css"
    />
  </head>
  <body>
    <div class="input-area">
      <div class="input-field">
        <label for="id"></label>
        <input type="text" name="id" id="id" placeholder="아이디" />
      </div>
      <div class="input-field">
        <label for="password"></label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="비밀번호"
        />
      </div>
      <div class="input-field">
        <label for="email"></label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="[선택] 이메일주소 (비밀번호 찾기 등 본인 확인용)"
        />
      </div>
    </div>
    <div class="input-area">
      <div class="input-field">
        <label for="name"></label>
        <input type="text" name="name" id="name" placeholder="이름" />
      </div>
      <div class="input-field">
        <label for="birth-date"></label>
        <input
          type="text"
          name="birth-date"
          id="birth-date"
          placeholder="생년월일 8자리"
        />
      </div>
      <div class="input-field">
        <label for="telecom"></label>
        <input
          type="text"
          name="telecom"
          id="telecom"
          placeholder="통신사 선택"
        />
      </div>
      <!-- <select name="telecom" id="">
        <option value="" disabled selected hidden>통신사 선택</option>
        <option value="">KT</option>
        <option value="">SKT</option>
        <option value="">LG U+</option>
      </select> -->
      <div class="input-field">
        <div class="radio-area">
          <div class="radio-field">
            <label for="male">남자</label>
            <input type="radio" name="gender" id="male" />
          </div>
          <div class="radio-field">
            <label for="female">여자</label>
            <input type="radio" name="gender" id="female" />
          </div>
        </div>
        <div class="radio-area">
          <div class="radio-field">
            <label for="local">내국인</label>
            <input type="radio" name="nationality" id="local" />
          </div>
          <div class="radio-field">
            <label for="foreigner">외국인</label>
            <input type="radio" name="nationality" id="foreigner" />
          </div>
        </div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-field">
        <label for="phone"></label>
        <input type="tel" name="phone" id="phone" placeholder="휴대전화번호" />
      </div>
    </div>
    <div class="input-area">
      <div class="input-field">
        <label for="agree"></label>
        <input type="checkbox" name="agree-terms" id="agree" />
        <p><span>[필수]</span> 인증 약관 전체 동의</p>
      </div>
    </div>
  </body>
</html>
