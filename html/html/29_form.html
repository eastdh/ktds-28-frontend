<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Form</title>
    <link type="text/css" rel="stylesheet" href="../css/29_form.css" />
  </head>
  <body>
    <h1>checkbox, radio 스타일링</h1>

    <label for="agree" class="sprite"></label>
    <input type="checkbox" name="agree-terms" id="agree" />

    <div class="input-area">
      <div class="input-field">
        <label for="male">남자</label>
        <input type="radio" name="gender" id="male" />
      </div>
      <div class="input-field">
        <label for="female">여자</label>
        <input type="radio" name="gender" id="female" />
      </div>
    </div>

    <h1>Input Types</h1>

    <input type="text" placeholder="Text를 입력하세요." />
    <input type="number" placeholder="숫자를 입력하세요." />
    <input type="email" placeholder="이메일을 입력하세요." />
    <input type="password" placeholder="비밀번호를 입력하세요." />
    <input type="file" placeholder="그림 파일을 선택하세요." />
    <input type="tel" placeholder="전화번호를 입력하세요." />

    <input type="radio" name="연령대" />
    <input type="radio" name="연령대" />
    <input type="radio" name="연령대" />

    <input type="radio" name="배송지" />
    <input type="radio" name="배송지" />
    <input type="radio" name="배송지" />

    <input type="checkbox" name="사은품" />
    <input type="checkbox" name="사은품" />
    <input type="checkbox" name="사은품" />

    <h1>Form Tags</h1>

    <label for="">Label</label>
    <input type="text" placeholder="input" />
    <textarea name="" id="" placeholder="textarea"></textarea>
    <select name="" id="">
      <option value="">A</option>
      <option value="">B</option>
      <option value="">C</option>
    </select>
    <!-- <datalist></datalist> -->
  </body>
</html>
