<!doctype html>
<html>
  <head>
    <title>Reverse Complex Style Practice</title>

    <!-- Internal Style: 우선 순위가 가장 낮다 -->
    <style type="text/css">
      div {
        font-size: 0.5rem; /* 8px */
      }
    </style>

    <!-- External Style: 우선 순위가 Internal Style보다 높다. -->
    <link
      type="text/css"
      rel="stylesheet"
      href="../css/05_external_style.css"
    />
  </head>

  <body>
    <!-- Inline Style: 우선 순위가 가장 높다. -->
    <div style="background-color: magenta; font-weight: 900">첫 번째 div</div>
    <div style="color: #a00">두 번째 div</div>
    <div style="font-size: 3rem">세 번째 div</div>
  </body>
</html>
